{% extends "base.html" %}
{% block title %}初始化管理员 · ExamForge{% endblock %}
{% block body %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-symbol">∑</div>
    <p class="auth-eyebrow">FIRST-TIME SETUP</p>
    <h1>创建管理员账号</h1>
    <p class="muted">密码使用 PBKDF2-SHA256 加盐哈希保存，不会以明文写入配置文件。</p>
    {% if error %}<div class="flag-rejected">{{ error }}</div>{% endif %}
    <form method="post" action="/setup" class="auth-form">
      <label>管理员用户名<input name="username" value="{{ username }}" minlength="3" autocomplete="username" required autofocus></label>
      <label>管理员密码<input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
      <label>确认密码<input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></label>
      <button type="submit">创建并进入系统</button>
    </form>
  </div>
</section>
{% endblock %}
