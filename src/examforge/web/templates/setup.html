{% extends "base.html" %}
{% block title %}初始化管理员 · ExamForge{% endblock %}
{% block body %}
<section class="auth-shell">
  <div class="auth-card auth-card-setup">
    <div class="auth-mini-brand">∑ ExamForge</div>
    <h1>创建管理员</h1>
    <p class="auth-subtitle">首次使用，请设置系统登录账号</p>
    {% if error %}<div class="flag-rejected auth-alert">{{ error }}</div>{% endif %}
    <form method="post" action="/setup" class="auth-form">
      <label><span>管理员用户名</span><input name="username" value="{{ username }}" minlength="3" autocomplete="username" required autofocus></label>
      <label><span>管理员密码</span><input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
      <label><span>确认密码</span><input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></label>
      <button type="submit" class="auth-submit">创建并进入系统</button>
    </form>
    <p class="auth-footnote">密码使用 PBKDF2-SHA256 加盐哈希保存</p>
  </div>
</section>
{% endblock %}
