<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{% block title %}ExamForge{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'code'] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page-glow page-glow-a"></div>
<div class="page-glow page-glow-b"></div>
<header class="topbar">
  <a class="brand" href="/" aria-label="ExamForge-Math 首页">
    <span class="brand-mark">∑</span>
    <span class="brand-text"><strong>ExamForge</strong><small>数学方法引擎</small></span>
  </a>
  {% if request.session.get('authenticated') or not auth_enabled() %}<nav class="main-nav" aria-label="主导航">
    <a class="nav-link {% if request.url.path == '/' %}is-active{% endif %}" href="/">首页</a>
    <a class="nav-link {% if request.url.path.startswith('/ingest') %}is-active{% endif %}" href="/ingest">录入</a>
    <a class="nav-link {% if request.url.path.startswith('/methods') %}is-active{% endif %}" href="/methods">方法库</a>
    <a class="nav-link {% if request.url.path.startswith('/review') %}is-active{% endif %}" href="/review">审核队列</a>
    <a class="nav-link {% if request.url.path.startswith('/report') %}is-active{% endif %}" href="/report">报告</a>
    <a class="nav-link {% if request.url.path.startswith('/qa') %}is-active{% endif %}" href="/qa">问答</a>
    <a class="nav-link {% if request.url.path.startswith('/settings') %}is-active{% endif %}" href="/settings">设置</a>
    <form method="post" action="/logout" class="logout-form"><button type="submit">退出</button></form>
  </nav>
  {% endif %}
</header>
<main class="app-shell">
  {% block body %}{% endblock %}
</main>
</body>
</html>
