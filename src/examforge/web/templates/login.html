{% extends "base.html" %}
{% block title %}登录 · ExamForge{% endblock %}
{% block body %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-mini-brand">∑ ExamForge</div>
    <h1>登录</h1>
    <p class="auth-subtitle">进入数学方法智能工作区</p>
    {% if error %}<div class="flag-rejected auth-alert">{{ error }}</div>{% endif %}
    {% if needs_setup %}
      <div class="flag-suspicious auth-alert">首次运行需要先创建管理员账号。</div>
      <a class="button-link auth-submit" href="/setup">创建管理员账号</a>
    {% else %}
    <form method="post" action="/login" class="auth-form">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label><span>用户名</span><input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
      <label><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="auth-submit">登录</button>
    </form>
    {% endif %}
    <p class="auth-footnote">安全访问 · 本地加密认证</p>
  </div>
</section>
{% endblock %}
